<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f4ff">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet">
  <title>AI Agent Voice Allday</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <a class="brand" href="/" aria-label="AI Agent Voice Allday หน้าหลัก">
        <span class="brand-mark" aria-hidden="true">✦</span>
        <span>AI Voice <strong>Allday</strong></span>
      </a>
      <div class="topbar-links">
        <a href="/dashboard/admin">ผู้ดูแลระบบ</a>
        <span class="connection"><span class="connection-dot"></span><span id="connection-label">กำลังตรวจสอบระบบ</span></span>
      </div>
    </header>

    <section class="chat-card" aria-label="แชตกับ AI">
      <div class="intro">
        <h1>ศูนย์บริการสั่งซื้อสินค้า 24 ชั่วโมง</h1>
      </div>

      <p id="ticket-info" class="status-message" hidden></p>
      <div id="conversation" class="conversation" aria-live="polite" aria-label="บทสนทนา">
        <div class="message assistant-message">
          <div class="avatar" aria-hidden="true">✦</div>
          <div class="bubble">
            <p>สวัสดีครับ วันนี้อยากให้ช่วยเรื่องอะไร?</p>
            <button class="speak-button" type="button" data-speak="สวัสดีครับ วันนี้อยากให้ช่วยเรื่องอะไร?" aria-label="อ่านคำทักทายออกเสียง">▶ ฟังเสียง</button>
          </div>
        </div>
      </div>

      <div class="voice-controls">
        <label class="select-label" for="speech-language">ภาษาสนทนา</label>
        <select id="speech-language" aria-label="เลือกภาษาสนทนา">
          <option value="th-TH" selected>ไทย</option>
          <option value="en-US">English (US)</option>
        </select>
      </div>

      <form id="chat-form" class="composer">
        <label class="sr-only" for="message-input">พิมพ์ข้อความถึง AI</label>
        <textarea id="message-input" name="message" rows="2" maxlength="4000" placeholder="พิมพ์ข้อความที่นี่..." required></textarea>
        <div class="composer-actions">
          <span id="status-message" class="status-message" role="status">เริ่มไมโครโฟนเพื่อสนทนาเรียลไทม์ หรือพิมพ์ข้อความ</span>
          <div class="action-buttons">
            <button id="mic-button" class="icon-button" type="button" title="เริ่มเสียงเรียลไทม์" aria-label="เริ่มเสียงเรียลไทม์">🎙️</button>
            <button id="send-button" class="send-button" type="submit"><span>ส่งข้อความ</span><span aria-hidden="true">➤</span></button>
          </div>
        </div>
      </form>
    </section>
  </main>
  <script src="/static/app.js" defer></script>
</body>
</html>
