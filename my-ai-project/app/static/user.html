<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <title>บัญชีส่วนตัว | 711SHOPPING</title>
  <link rel="stylesheet" href="/static/home.css">
  <link rel="stylesheet" href="/static/member.css">
  <link rel="stylesheet" href="/static/user.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-content">
      <a class="brand" href="/" aria-label="711SHOPPING หน้าหลัก">
        <span class="brand-mark" aria-hidden="true"><span>GO</span><small>DELIVERY</small></span>
        <span class="brand-name">711SHOPPING</span>
      </a>
      <nav class="desktop-nav" aria-label="เมนูหลัก">
        <a href="/">หน้าแรก</a>
        <a href="/product">ผลิตภัณฑ์</a>
        <a href="/faq">คำถามที่พบบ่อย</a>
        <a href="/cart">ตะกร้า</a>
        <a href="/user-profile" aria-current="page">บัญชีส่วนตัว</a>
      </nav>
    </div>
  </header>
  <main class="container user-page">
    <section class="user-card">
      <span class="section-kicker">MY ACCOUNT</span>
      <h1>บัญชีส่วนตัว</h1>
      <p class="member-note">หมายเลขลูกค้า <strong id="user-customer-no"></strong></p>
      <form id="user-form" class="member-form">
        <label>ชื่อ-สกุล<input name="name" maxlength="160" autocomplete="name" disabled></label>
        <label>เบอร์โทร<input name="phone" type="tel" maxlength="24" autocomplete="tel" disabled></label>
        <label>อีเมล<input id="user-email" disabled></label>
        <label>ที่อยู่<input name="address" maxlength="500" autocomplete="address-line1" disabled></label>
        <label>ที่อยู่ 1<input name="address1" maxlength="500" autocomplete="address-line2" disabled></label>
        <label>รหัสไปรษณีย์<input name="postcode" inputmode="numeric" pattern="[0-9]{5}" maxlength="5" autocomplete="postal-code" disabled></label>
        <div class="member-hp" aria-hidden="true"><input name="website" tabindex="-1" autocomplete="off"></div>
        <p id="user-state" class="member-state" role="status"></p>
        <div class="member-row">
          <button type="button" id="user-edit" class="member-btn member-btn-primary">แก้ไขข้อมูล</button>
          <button type="submit" id="user-save" class="member-btn member-btn-primary" hidden>บันทึกข้อมูล</button>
          <button type="button" id="user-cancel" class="member-btn" hidden>ยกเลิก</button>
          <button type="button" id="user-logout" class="member-btn">ออกจากระบบ</button>
        </div>
      </form>
    </section>
  </main>
  <script src="/static/user.js" defer></script>
</body>
</html>
